name: VRFusion CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Validate Python Control Center Syntax
      run: |
        python -m py_compile VRFusion_Control_Center.py

    - name: Validate PowerShell Scripts
      shell: pwsh
      run: |
        Get-ChildItem -Filter "*.ps1" -Recurse | ForEach-Object {
            Write-Host "Validating $($_.Name)..."
            [scriptblock]::Create((Get-Content $_.FullName -Raw)) | Out-Null
        }
